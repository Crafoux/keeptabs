<!doctype html>
<!--
	Template of a Keep Tabs session file. The double-brace placeholders are
	filled by src/lib/session-file.js. The format is described in
	docs/technical/session-file-format.md.
-->
<html lang="{{lang}}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="generator" content="Keep Tabs">
	<meta name="keeptabs-format" content="{{format}}">
	<title>{{name}}</title>
	<style>
		:root {
			color-scheme: light dark;
			--bg: #ffffff;
			--fg: #1f2328;
			--muted: #59636e;
			--panel: #f6f8fa;
			--link: #0969da;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #0d1117;
				--fg: #e6edf3;
				--muted: #9198a1;
				--panel: #151b23;
				--link: #4493f8;
			}
		}

		body {
			max-width: 760px;
			margin: 0 auto;
			padding: 40px 16px;
			font: 15px/1.5 system-ui, sans-serif;
			color: var(--fg);
			background: var(--bg);
		}

		h1 {
			margin: 0 0 4px;
			font-size: 24px;
			overflow-wrap: anywhere;
		}

		.summary {
			margin: 0 0 20px;
			color: var(--muted);
		}

		.status {
			padding: 12px 14px;
			border-radius: 8px;
			background: var(--panel);
		}

		/* Tabs are numbered in window order, across the groups. */
		.tabs {
			padding: 0;
			list-style: none;
			counter-reset: tab;
		}

		.tabs ol {
			padding: 0;
			list-style: none;
		}

		.tab {
			margin: 6px 0;
			padding-left: 2.2em;
			text-indent: -2.2em;
			overflow-wrap: anywhere;
			counter-increment: tab;
		}

		.tab::before {
			content: counter(tab) ".";
			display: inline-block;
			width: 2.2em;
			text-indent: 0;
			color: var(--muted);
		}

		a {
			color: var(--link);
		}

		.badge {
			display: inline-block;
			margin-right: 6px;
			padding: 0 8px;
			border-radius: 10px;
			font-size: 12px;
			text-indent: 0;
			color: var(--fg);
			background: var(--panel);
		}

		/* A group is shown as in the browser: its name on its color, and a
		   line of that color along its tabs. */
		.group {
			--group: #5f6368;
			margin: 12px 0;
			padding-left: 10px;
			border-left: 4px solid var(--group);
		}

		.group-title {
			display: inline-block;
			padding: 0 8px;
			border-radius: 10px;
			font-size: 13px;
			font-weight: 600;
			color: #ffffff;
			background: var(--group);
			overflow-wrap: anywhere;
		}

		.group-blue { --group: #1a73e8; }
		.group-red { --group: #d93025; }
		.group-yellow { --group: #e37400; }
		.group-green { --group: #188038; }
		.group-pink { --group: #d01884; }
		.group-purple { --group: #a142f4; }
		.group-cyan { --group: #007b83; }
		.group-orange { --group: #fa903e; }

		.keeptabs-frame {
			width: 100%;
			border: 0;
			vertical-align: top;
		}
	</style>
</head>
<body>
	<h1>{{name}}</h1>
	<p class="summary">{{summary}}</p>
	<p class="status" id="keeptabs-status">{{notInstalled}}</p>
	<ol class="tabs">
{{tabs}}
	</ol>
	<script type="application/json" id="keeptabs-session">{{sessionJson}}</script>
	<script>
		// Hands the session to Keep Tabs through a hidden frame of the
		// extension. The data never appears in an address, so it never reaches
		// the browser history. Without Keep Tabs nothing answers, and the page
		// simply stays a list of links.
		(function () {
			var origin = 'chrome-extension://' + {{extensionIdJson}};
			// Added to the address of this tab once the session is handed over.
			// A reload, or the browser reopening the tab at startup, keeps it:
			// Keep Tabs then asks before restoring the window a second time.
			var restoredMark = '#keeptabs-restored';
			var alreadyRestored = location.hash === restoredMark;
			var status = document.getElementById('keeptabs-status');
			var frame = document.createElement('iframe');
			window.addEventListener('message', function (event) {
				if (event.origin !== origin || event.source !== frame.contentWindow || !event.data) {
					return;
				}
				if (event.data.type === 'keeptabs-ready') {
					if (!alreadyRestored) {
						status.textContent = {{restoringJson}};
					}
					frame.contentWindow.postMessage({
						type: 'keeptabs-session',
						session: document.getElementById('keeptabs-session').textContent,
						alreadyRestored: alreadyRestored
					}, origin);
					if (!alreadyRestored) {
						try {
							history.replaceState(null, '', restoredMark);
						} catch (error) {
							console.error('Keep Tabs: could not mark this tab as restored.', error);
						}
					}
				} else if (event.data.type === 'keeptabs-report' && typeof event.data.height === 'number') {
					// Keep Tabs shows the outcome of the restore in place of
					// the status message, in the language of the browser.
					status.hidden = true;
					frame.hidden = false;
					frame.style.height = Math.max(0, Math.ceil(event.data.height)) + 'px';
				}
			});
			frame.src = origin + '/{{receiverPath}}';
			frame.className = 'keeptabs-frame';
			frame.hidden = true;
			status.after(frame);
		})();
	</script>
</body>
</html>
