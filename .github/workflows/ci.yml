name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default: this workflow never needs to write to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA so a moved tag cannot change
      # what runs here. Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check
