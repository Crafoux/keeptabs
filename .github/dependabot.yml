version: 2
updates:
  # Development tools (Vitest, TypeScript, Chrome types).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  # Actions used by the CI workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
